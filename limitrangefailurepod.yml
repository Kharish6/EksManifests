apiVersion: v1
kind: Pod
metadata:
  name: limitrangefailurepod
  namespace: mynamespace1
spec:
  containers:
  - name: nginx-container
    image: nginx:latest
    resources:
      limits:
        #defined resource limits for the container, which specify the maximum amount of resources that the container can use
        cpu: "1"
        memory: "2Gi"
      requests:
        cpu: "1"
        memory: "2Gi"
