apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logscollector
spec:
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: ngnix-container
        image: nginx:latest
        ports:
        - containerPort: 80
